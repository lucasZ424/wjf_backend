[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "htsg-backend"
version = "1.0.0-rc4"
description = "HTSG single-host monitoring backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.52.4", "psycopg[binary]==3.3.5", "pydantic==2.13.5", "pymodbus==3.15.0", "asyncua==2.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
htsg = "htsg.cli:main"

[tool.setuptools.packages.find]
include = ["htsg*"]

[tool.setuptools.package-data]
htsg = ["archive_schema.sql", "static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
