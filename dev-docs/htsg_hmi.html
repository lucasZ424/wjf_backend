<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锅炉高温应变·管系位移安全监测系统</title>
<style>
:root{
  --bg:#1c2a42; --bg2:#1a2840; --panel:#1e2d48; --panel2:#223354;
  --border:#2a4060; --border2:#3a5278;
  --txt:#cbd9e8; --muted:#7aa0c8; --dim:#6896be;
  --cyan:#70b8ff; --blue:#2e78e0; --green:#2ecc71; --amber:#f5a623; --red:#ff5555; --purple:#a78bfa; --orange:#ff9d4d;
  --grid:#2a4060;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei",-apple-system,sans-serif;
  background:linear-gradient(180deg,#1a2840 0%,#1c2a42 100%);
  color:var(--txt); font-size:13px; overflow:hidden; height:100vh;
  display:flex; flex-direction:column;
}
#topbar{
  height:54px; flex:0 0 54px; display:flex; align-items:center;
  background:linear-gradient(180deg,#1e3050,#1a2840);
  border-bottom:1px solid var(--border2); padding:0 16px; gap:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.5); z-index:20;
}
#logo{display:flex;align-items:center;gap:10px;flex-shrink:1;min-width:0;overflow:hidden}
#logo .mark{
  width:42px;height:34px;border-radius:7px;
  background:linear-gradient(135deg,var(--orange),#e8612a);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#1a0c03;font-size:12px;letter-spacing:.5px;
  box-shadow:0 0 14px rgba(255,157,77,.45);
}
#logo .t1{font-size:15px;font-weight:700;letter-spacing:.5px;color:#eaf4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo .t2{font-size:10px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
#topbar .spacer{flex:1}
.unit-sel{display:flex;align-items:center;gap:6px;background:#1a2a45;border:1px solid var(--border);border-radius:6px;padding:4px 6px}
.unit-sel select{background:transparent;color:var(--cyan);border:none;font-size:13px;font-weight:600;outline:none}
.tb-stat{display:flex;align-items:center;gap:7px;padding:5px 11px;background:#1a2a45;border:1px solid var(--border);border-radius:6px;font-size:12px;white-space:nowrap;flex-shrink:0}
.tb-stat .led{width:9px;height:9px;border-radius:50%;box-shadow:0 0 7px currentColor}
.led.g{background:var(--green);color:var(--green)}
.led.a{background:var(--amber);color:var(--amber)}
.led.r{background:var(--red);color:var(--red)}
.led.c{background:var(--cyan);color:var(--cyan)}
#clock{font-variant-numeric:tabular-nums;font-size:13px;color:#dbe9f7;min-width:148px;text-align:right}
#nav{
  flex:0 0 42px;height:42px;display:flex;align-items:center;gap:3px;
  background:#1c2e4a;border-bottom:1.5px solid var(--border2);padding:0 14px;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;z-index:15;
}
#nav::-webkit-scrollbar{height:5px}
#nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.navbtn{
  display:inline-flex;align-items:center;gap:5px;padding:0 12px;height:30px;flex-shrink:0;
  border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);
  font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;
  letter-spacing:.02em;transition:all .15s;
}
.navbtn:hover{background:#243860;color:#c8e0ff}
.navbtn.active{color:#90ccff;background:#1e4278;border-color:#3a6abf;box-shadow:0 0 8px rgba(50,120,255,.25)}
.navbtn .ix{font-size:10px;opacity:.55;font-weight:700;font-family:monospace}
.navbtn .key{color:var(--amber);font-size:8px;border:1px solid var(--amber);border-radius:3px;padding:0 3px;opacity:.9}
#main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow:auto;padding:12px;display:none}
.page.active{display:block}
.page::-webkit-scrollbar{width:8px;height:8px}
.page::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.page::-webkit-scrollbar-track{background:#1a2a44}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--border);border-radius:9px;padding:11px 13px;position:relative}
.card.key{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(112,184,255,.15),0 6px 20px rgba(0,0,0,.3)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.card-h .ttl{font-size:13px;font-weight:600;color:#dbeafe;display:flex;align-items:center;gap:7px}
.card-h .ttl .dot{width:7px;height:7px;border-radius:2px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.card-h .sub{font-size:11px;color:var(--muted)}
.badge{font-size:10px;padding:2px 8px;border-radius:11px;border:1px solid var(--border2);color:var(--muted)}
.badge.key{background:rgba(112,184,255,.12);border-color:var(--cyan);color:var(--cyan)}
.badge.ok{background:rgba(46,204,113,.12);border-color:var(--green);color:var(--green)}
.badge.warn{background:rgba(245,166,35,.13);border-color:var(--amber);color:var(--amber)}
.badge.alm{background:rgba(255,85,85,.14);border-color:var(--red);color:var(--red)}
.vbtn{padding:3px 10px;font-size:11px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:#223354;color:var(--muted);font-family:inherit;transition:all .15s}
.vbtn:hover{background:#243860;color:#c8e0ff}
.vbtn.on{border-color:#3a6abf;background:#1e4278;color:#90ccff}
.metric{background:#223354;border:1px solid var(--border2);border-radius:7px;padding:10px 13px;position:relative;overflow:hidden}
.metric .ml{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.metric .mv{font-size:23px;font-weight:700;color:#e8f4ff;font-family:"Consolas",monospace;font-variant-numeric:tabular-nums;line-height:1}
.metric .mv small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.metric .mtrend{font-size:10px;color:var(--muted);margin-top:6px}
.metric .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.metric.warn .accent{background:var(--amber)} .metric.alm .accent{background:var(--red)}
.metric.warn .mv{color:#ffd98a} .metric.alm .mv{color:#ff9b9b}
canvas{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px}
td{padding:6px 8px;border-bottom:1px solid #1a2a40;font-variant-numeric:tabular-nums}
tr:hover td{background:#243860}
.mono{font-family:"Consolas","Courier New",monospace}
.tag-g{color:var(--green)} .tag-a{color:var(--amber)} .tag-r{color:var(--red)} .tag-c{color:var(--cyan)}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px}
.pill.g{background:rgba(46,204,113,.15);color:var(--green)}
.pill.a{background:rgba(245,166,35,.15);color:var(--amber)}
.pill.r{background:rgba(255,85,85,.16);color:var(--red)}
.pill.c{background:rgba(112,184,255,.14);color:var(--cyan)}
.alm-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;margin-bottom:5px;background:#223354;border-left:3px solid var(--border2);font-size:12px}
.alm-row.r{border-left-color:var(--red);background:rgba(255,85,85,.07)}
.alm-row.a{border-left-color:var(--amber);background:rgba(245,166,35,.06)}
.alm-row.g{border-left-color:var(--green)}
.alm-row .ts{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.alm-row .src{color:var(--muted);font-size:10px;margin-left:auto}
#ctrl{
  flex:0 0 50px;height:50px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(0deg,#223354,#1a2a44);border-top:1px solid var(--border2);z-index:18;
  box-shadow:0 -2px 12px rgba(0,0,0,.4);
}
#ctrl .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#ctrl .demo-tag{font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px;opacity:.8}
.slider-wrap{display:flex;align-items:center;gap:9px}
input[type=range]{width:150px;accent-color:var(--cyan);cursor:pointer}
.cbtn{
  background:#1e4278;border:1px solid var(--border2);color:var(--txt);border-radius:6px;
  padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .12s;
}
.cbtn:hover{background:#3a6abf;border-color:var(--cyan)}
.cbtn.on{background:var(--cyan);color:#04141f;border-color:var(--cyan);font-weight:600}
.cbtn.warn{border-color:var(--amber)} .cbtn.warn:hover{background:#5a4012}
.cbtn.alm{border-color:var(--red)} .cbtn.alm:hover{background:#5a1818}
.cbtn.reset{margin-left:auto;border-color:var(--border2)}
.flex{display:flex} .ac{align-items:center} .jb{justify-content:space-between} .gap{gap:10px}
.note{font-size:11px;color:var(--muted);line-height:1.7}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a2a40;font-size:12px}
.kv:last-child{border:none}
.kv .k{color:var(--muted)} .kv .v{font-variant-numeric:tabular-nums;color:#dbe9f7}
h4.sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:4px 0 8px;font-weight:600}
.diffbar{background:linear-gradient(90deg,rgba(255,157,77,.13),transparent);border-left:3px solid var(--orange);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:#ffe0c2;margin-bottom:10px}
.diffbar b{color:var(--orange)}
.srcbar{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(46,120,224,.10),transparent);border-left:3px solid #2e78e0;padding:6px 12px;border-radius:0 5px 5px 0;font-size:11.5px;color:#9fc0e0;margin-bottom:10px}
.srcbar .tag{font-size:9px;font-weight:700;letter-spacing:.08em;color:#04141f;background:#2e78e0;border-radius:3px;padding:1px 6px;flex-shrink:0}
.srcbar b{color:#cfe0ee;font-weight:600}
#toast{position:fixed;top:62px;right:18px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#1e3050;border:1px solid var(--border2);border-left:3px solid var(--cyan);border-radius:6px;padding:9px 14px;font-size:12.5px;color:#dbe9f7;box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:0;transform:translateX(24px);transition:all .25s;max-width:340px;line-height:1.5}
.toast.show{opacity:1;transform:none}
.toast.warn{border-left-color:var(--amber)} .toast.alm{border-left-color:var(--red)} .toast.ok{border-left-color:var(--green)}
@keyframes pulseA{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.5)}50%{box-shadow:0 0 0 6px rgba(245,166,35,0)}}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(255,85,85,.55)}50%{box-shadow:0 0 0 7px rgba(255,85,85,0)}}
.cbtn.pulse{animation:pulseA 1.1s infinite;border-color:var(--amber);color:#ffd98a}
.cbtn.pulse.alm{animation:pulseR 1.1s infinite;border-color:var(--red);color:#ff9b9b}
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">
    <div class="mark">HTSG</div>
    <div>
      <div class="t1">锅炉高温应变·管系位移安全监测系统</div>
      <div class="t2">HIGH-TEMP STRAIN GAUGE SURVEILLANCE</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="unit-sel">
    <span class="led g" id="unitLed"></span>
    <select id="unitSel" onchange="setUnit(this.value)">
      <option value="1">1#锅炉机组</option>
      <option value="2">2#锅炉机组</option>
    </select>
  </div>
  <div class="tb-stat"><span class="led g" id="acqLed"></span>采集 Acheron</div>
  <div class="tb-stat"><span class="led g" id="anaLed"></span>分析 Mondo</div>
  <div class="tb-stat"><span class="led c"></span>DCS · OPC-UA</div>
  <div class="tb-stat" id="globalStat"><span class="led g" id="globalLed"></span><span id="globalTxt">系统正常</span></div>
  <div id="clock">------ --:--:--</div>
</div>

<div id="nav"></div>
<div id="main"></div>

<div id="ctrl">
  <span class="demo-tag">演示控制</span>
  <div class="slider-wrap">
    <span class="lbl">机组负荷</span>
    <input type="range" id="loadSlider" min="20" max="100" value="75" oninput="setLoad(this.value)">
    <span id="loadVal" style="min-width:74px;color:var(--cyan);font-weight:600">495 MW</span>
  </div>
  <button class="cbtn warn" id="btnThermal" onclick="fireThermalShock()">🔥 温度阶跃</button>
  <button class="cbtn" id="btnCycle" onclick="toggleDeepCycle()">⚙ 深调循环</button>
  <button class="cbtn warn" id="btnCrack" onclick="stepCrack()">🛠 焊缝裂纹 +</button>
  <button class="cbtn alm" id="btnSeize" onclick="toggleSeize()">🔒 支吊架卡涩</button>
  <button class="cbtn reset" onclick="resetSim()">↺ 复位</button>
</div>
<div id="toast"></div>

<script>
/* =====================================================================
   HTSG 锅炉高温应变·管系位移安全监测系统 — 前端仿真演示
   业主: 京能(锡林郭勒)发电有限公司 660MW 超超临界褐煤机组(B&W)
   采集 Acheron · 分析 Mondo · 过程数据 DCS(OPC-UA/Modbus)
   传感器: 高温应变计(>630℃, 50Hz) DYN-S-HT-C-1000 + 应变释放/防护装置
   所有数据均为前端仿真,仅供产品演示。
   ===================================================================== */

/* ---------- 全局配置 ---------- */
const RATED_MW = 660;
const BOILER = 'B&WB-2117/29.4-M';          // 锅炉型号
const E_HOT   = 170000;                       // 12Cr1MoVG 600℃ 弹性模量 MPa
const ALPHA   = 13.5e-6;                       // 线膨胀系数 1/℃
const NU      = 0.3;
const SY_HOT  = 205;                           // 12Cr1MoVG 高温(~600℃)屈服 MPa
const SALLOW  = 84;                            // GB5310 高温许用应力 MPa(~580℃)
const ACCEL   = 200;                           // 演示时间加速: 每秒 ≈200 运行小时(蠕变/损伤可见)
const P92_E   = 165000;                        // P92 主蒸汽管 620℃ E MPa
const P92_SY  = 230;                           // P92 高温屈服 MPa

// 前墙水冷壁上集箱: 原4大段→改造为8小段, 标高78650→78890(抬高240mm), φ219×50, 12Cr1MoVG
const HEADERS = ['H1','H2','H3','H4','H5','H6','H7','H8'];
// 应变测点(KKS风格命名), 类型: weld=管座角焊缝(横向裂纹高发) / endcap=端盖焊缝 / tube=水冷壁光管 / fin=鳍片 / outlet=Φ133引出管
const WW_SENSORS = [
  {id:'10HAD11-W', hdr:0, type:'weld',   name:'H1 管座角焊缝',   kt:2.6},
  {id:'10HAD12-W', hdr:1, type:'weld',   name:'H2 管座角焊缝',   kt:2.7},
  {id:'10HAD13-W', hdr:2, type:'weld',   name:'H3 管座角焊缝',   kt:2.9},
  {id:'10HAD14-W', hdr:3, type:'weld',   name:'H4 管座角焊缝',   kt:3.1},
  {id:'10HAD15-W', hdr:4, type:'weld',   name:'H5 管座角焊缝',   kt:3.0},
  {id:'10HAD16-W', hdr:5, type:'weld',   name:'H6 管座角焊缝',   kt:2.8},
  {id:'10HAD17-W', hdr:6, type:'weld',   name:'H7 管座角焊缝',   kt:2.7},
  {id:'10HAD18-W', hdr:7, type:'weld',   name:'H8 管座角焊缝',   kt:2.6},
  {id:'10HAD14-E', hdr:3, type:'endcap', name:'H4 端盖环焊缝',   kt:2.2},
  {id:'10HAD15-E', hdr:4, type:'endcap', name:'H5 端盖环焊缝',   kt:2.2},
  {id:'10HAD14-O', hdr:3, type:'outlet', name:'H4 Φ133 引出管',  kt:1.9},
  {id:'10HAD15-O', hdr:4, type:'outlet', name:'H5 Φ133 引出管',  kt:1.9},
  {id:'10HAD13-T', hdr:2, type:'tube',   name:'H3 水冷壁光管',   kt:1.3},
  {id:'10HAD16-T', hdr:5, type:'tube',   name:'H6 水冷壁光管',   kt:1.3},
  {id:'10HAD14-F', hdr:3, type:'fin',    name:'H4 鳍片(膜式壁)', kt:1.6},
  {id:'10HAD15-F', hdr:4, type:'fin',    name:'H5 鳍片(膜式壁)', kt:1.6},
];
// 主蒸汽管道—汽轮机高压缸 法兰应变测点(四象限): 颈部轴向εz(反算弯矩) + 法兰环环向εθ(翘曲/密封)
// 周向 0°上 / 90°右 / 180°下 / 270°左
const FLANGE_QUAD = ['0° 上','90° 右','180° 下','270° 左'];
// 管系位移测点(拉丝位移0-300mm/倾角传感器), 含吊杆载荷
const PIPE_NODES = [
  {id:'MS-P1', name:'主蒸汽管 立管段',  base:18},
  {id:'MS-P2', name:'主蒸汽管 弯头前',  base:26},
  {id:'MS-P3', name:'汽机入口 法兰颈',  base:31},
  {id:'RH-P1', name:'再热热段 水平段',  base:22},
];
const HANGERS = [
  {id:'HG-01', name:'吊杆#1 主蒸汽立管', rated:62},
  {id:'HG-02', name:'吊杆#2 主蒸汽弯头', rated:58},
  {id:'HG-03', name:'恒力弹簧吊#3 水平段', rated:74},
  {id:'HG-04', name:'吊杆#4 汽机近端',   rated:45},
];
const HAS_EXPANSION_JOINT = false;   // 主汽法兰: 无膨胀节(法兰硬扛)→ 演示弯矩/翘曲随温度抬升

/* ---------- 仿真状态 ---------- */
const S = {
  t:0, unit:1,
  loadPct:75,
  thermalT:-99,            // 温度阶跃/热冲击触发时刻
  deepCycle:false,         // 深调循环(快速变负荷)
  crackPct:0,              // 焊缝裂纹萌生程度(驱动 H4 管座应力集中上升)
  seize:false,             // 支吊架卡涩(膨胀受阻→法兰弯矩/猫爪侧推上升)
  ww:{},                   // 水冷壁各测点 {strain,stress,temp,pctYield,...}
  field:[],                // 应变场云图栅格
  creep:{},                // 各测点蠕变累计 με
  weldCrack:{},            // 各焊缝裂纹深度估计 mm
  flange:{neckZ:[0,0,0,0], ringT:[0,0,0,0], Tq:[0,0,0,0]},  // 四象限应变/温度
  fIdx:{B:0,Bx:0,By:0,W:0,A:0,R:0,dT:0},                     // 法兰诊断指标
  pipe:{},                 // 管系位移
  hanger:{},               // 吊杆载荷
  expAbs:0, expDiff:0, catClawLat:0,   // 缸体绝对膨胀/胀差/猫爪侧推
  proc:{},                 // DCS 过程数据
  alarms:[],
  fatigue:0,               // 集箱疲劳累计损伤(深调循环)
  creepLife:0,             // 蠕变寿命损耗
  cycleCount:0,            // 深调循环计数
  hist:{},
  log:[],
  uptime:412,
};
function pushLog(src,lv,msg){
  const d=new Date();
  S.log.unshift({t:d.toLocaleTimeString('zh-CN',{hour12:false}), src, lv, msg});
  if(S.log.length>200) S.log.pop();
}
function initState(){

/* ---------- 物理量换算 ---------- */
// 总应变(με) → 应力(MPa): σ = E·ε
function strToStress(ueMech, E){ return (E||E_HOT) * ueMech*1e-6; }
// 厚壁集箱 内外壁温差 ΔT 引起的热应力(二次应力): σ_th = E·α·ΔT / (2(1-ν))
function thermalStress(dT){ return E_HOT*ALPHA*dT/(2*(1-NU)); }

/* =====================================================================
   算法引擎 (数字孪生四层) —— 真实可计算的轻量实现
   ① 场映射/重构: RBF(多二次)插值 [代理 PINN/iFEM]
   ② 蠕变本构: Norton-Bailey 在线积分 + Larson-Miller(LMP) + Robinson 累积
   ③ 异常检测: PCA/SPE 多维不协同(残差Q统计) [代理 Isolation Forest]
   ④ 预测/寿命: Holt 线性趋势预测+预测带 [代理 LSTM] + Weibull/Bayes RUL
   ===================================================================== */
// 高斯消元解线性方程组 A x = b
function solveLin(A,b){
  const n=b.length;b=b.slice();A=A.map(r=>r.slice());
  for(let p=0;p<n;p++){ let mx=p; for(let i=p+1;i<n;i++)if(Math.abs(A[i][p])>Math.abs(A[mx][p]))mx=i;
    [A[p],A[mx]]=[A[mx],A[p]];[b[p],b[mx]]=[b[mx],b[p]];
    const piv=A[p][p]||1e-9;
    for(let i=p+1;i<n;i++){const f=A[i][p]/piv;for(let j=p;j<n;j++)A[i][j]-=f*A[p][j];b[i]-=f*b[p];}
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=b[i];for(let j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/(A[i][i]||1e-9);}
  return x;
}
// 测点在水冷壁面归一化坐标 (x=集箱跨度, y=高度方向)
const ROW_Y={outlet:0.16,endcap:0.30,weld:0.50,fin:0.63,tube:0.80};
const SENSOR_XY = WW_SENSORS.map(s=>[ (s.hdr+0.5)/8, ROW_Y[s.type] ]);
const ALG = {
  // ---- ① RBF 多二次插值场重构 ----
  _rbf:null, _eps:0.12, _ridge:0.0002,
  rbfFit(vals){ const C=SENSOR_XY, n=C.length, c=this._eps;
    const phi=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy+c*c);};
    const M=[]; for(let i=0;i<n;i++){M.push([]);for(let j=0;j<n;j++)M[i].push(phi(C[i],C[j]));M[i][i]+=this._ridge;}
    this._rbf={w:solveLin(M,vals),phi,C}; return this._rbf; },
  rbfEval(x,y){ const R=this._rbf; if(!R)return 0; let s=0; for(let j=0;j<R.C.length;j++)s+=R.w[j]*R.phi([x,y],R.C[j]); return s; },
  // 留一交叉验证 → 重构置信度(%)
  rbfLOO(vals){ const C=SENSOR_XY,n=C.length,c=this._eps;
    const phi=(a,b)=>{const dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy+c*c);};
    let se=0,meanV=vals.reduce((a,b)=>a+Math.abs(b),0)/n;
    for(let k=0;k<n;k++){ const idx=[...Array(n).keys()].filter(i=>i!==k);
      const M=idx.map(i=>idx.map(j=>phi(C[i],C[j])+(i===j?this._ridge:0)));
      const w=solveLin(M,idx.map(i=>vals[i]));
      let pred=0; idx.forEach((i,jj)=>pred+=w[jj]*phi(C[k],C[i]));
      se+=(pred-vals[k])**2; }
    const rmse=Math.sqrt(se/n);                                   // 留一交叉验证 RMSE
    return Math.max(0,Math.min(100, 100*(1-rmse/(meanV+1e-6)))); }, // 相对精度(%)
  // ---- ② Norton-Bailey 蠕变本构 ε̇c = A σ^n t^m (时间硬化, 演示加速) ----
  nbA:2.7e-11, nbN:5.0, nbM:-0.55, nbTref:773,
  nbRate(sigma,Tc,tHr){ const T=Tc+273;
    const tempAcc=Math.exp(12*(1 - this.nbTref/T));               // 阿伦尼乌斯型温度加速
    return this.nbA*Math.pow(Math.max(1,sigma),this.nbN)*Math.pow(Math.max(1,tHr),this.nbM)*tempAcc; }, // με/h
  // Larson-Miller: 断裂寿命 tr (h);  LMP = a - b·log10(σ),  P=T(C+log10 tr)/1000
  lmpC:20,
  lmp(sigma){ return 24.8 - 2.35*Math.log10(Math.max(5,sigma)); },
  ruptureHrs(sigma,Tc){ const T=Tc+273; const ex=this.lmp(sigma)*1000/T - this.lmpC; return Math.pow(10, Math.min(12,Math.max(0,ex))); },
  // ---- ③ PCA/SPE 多维不协同 (残差 Q 统计) ----
  // 健康基线: 各测点应力对负荷的慢自适应期望; 残差标准化平方和=SPE
  base:{}, baseInit(id,v){ this.base[id]={mu:v,var:49}; },
  // 均值慢自适应(健康学习,故障时基线跟不上→残差累积);方差较快学习正常波动幅度
  speUpdate(ids){ let spe=0,worst={id:'',z:0}; const zs={};
    ids.forEach(id=>{ const o=S.ww[id]; const b=this.base[id]||(this.base[id]={mu:o.stress,var:49});
      const z=(o.stress-b.mu)/Math.sqrt(b.var); zs[id]=z; spe+=z*z; if(Math.abs(z)>Math.abs(worst.z))worst={id,z};
      // 鲁棒学习: 仅在"受控"(|z|<2.5)样本上更新基线,持续故障不被基线吸收 → SPE 维持高位
      const aMu=0.0025, aVar=0.02, e=o.stress-b.mu;
      if(Math.abs(z)<2.5){ b.mu+=aMu*e; b.var=Math.max(36,(1-aVar)*b.var+aVar*e*e); } });
    return {spe, worst, zs, k:ids.length}; },
  // ---- ④ Holt 线性趋势预测 + 预测带 (代理 LSTM) ----
  holt:{l:null,b:0,sErr:4},
  holtStep(y,h){ const H=this.holt, al=0.18, be=0.05;
    if(H.l===null){H.l=y;H.b=0;return {fc:y,band:4,slope:0,breach:false,innov:0};}
    const pred1=H.l+H.b;                          // 一步超前预测
    const err=y-pred1; const sd=Math.sqrt(H.sErr);
    const breach = err>2.2*sd && err>4;           // 实测显著高于预测(只关注上行突增)
    const lp=H.l; H.l=al*y+(1-al)*pred1; H.b=be*(H.l-lp)+(1-be)*H.b;
    H.sErr=0.93*H.sErr+0.07*err*err;
    return {fc:H.l+h*H.b, band:2*sd+4, slope:H.b, breach, innov:err}; },
  // ---- Weibull + 贝叶斯 RUL ----
  wbK:3.2, wbLam0:2.6e5,   // 形状/初始尺度(h)
  rul(D, creepRate){
    // 贝叶斯: 实测蠕变速率高于额定 → 收缩尺度 λ(寿命变短)
    const nomRate=0.6, lam=this.wbLam0*Math.max(0.25, nomRate/Math.max(nomRate,creepRate));
    const q=(p)=>lam*Math.pow(-Math.log(1-p),1/this.wbK)*(1-Math.min(0.98,D)); // 分位数×剩余比例
    return {med:q(0.5), lo:q(0.1), hi:q(0.9), lam, k:this.wbK}; },
};

/* ---------- 仿真更新 ---------- */
function updateSim(dt){
  S.t += dt;
  const lf = S.loadPct/100;          // 机组负荷仅由滑块手动设定,不自动滑动
  // 深调循环: 不改动负荷,仅叠加快速变负荷的交变热应力并累计循环次数(疲劳)
  if(S.deepCycle){
    const c = Math.sin(S.t*0.5);
    if(updateSim._lastC!==undefined && updateSim._lastC*c<0) S.cycleCount++;
    updateSim._lastC=c;
  }
  // 平滑抖动(确定性正弦,非每帧随机)→ 数值缓慢漂移,DOM 与画布数字均不闪烁
  let _ji=0; const jit=(a)=>{ _ji++; return 1+a*0.5*Math.sin(S.t*(0.45+0.08*(_ji%7))+_ji*0.9); };

  // 温度阶跃/热冲击包络: 触发后内外壁温差骤升再衰减(深调变负荷/启停的典型热冲击)
  const tsSince = S.t - S.thermalT;
  const shock = tsSince>=0 && tsSince<40 ? Math.exp(-tsSince*0.10)*(tsSince<1.5?tsSince/1.5:1) : 0;
  // 低负荷热偏差: 超低负荷(<45%)火焰中心偏移/各屏吸热不均→水冷壁壁温偏差与内外温差加大
  const lowLoadDT = lf<0.45 ? Math.pow((0.45-lf)/0.45,1.2)*22 : 0;
  // 深调快速变负荷的速率项(壁温响应滞后→瞬态温差)
  const rate = S.deepCycle ? Math.abs(Math.cos(S.t*0.16))*0.16*14 : 0;

  /* ===== 应用1: 水冷壁高温应变场 (多因素: 负荷+工质流量+蒸汽流量→壁温/热应力) ===== */
  const wwFlowPct = Math.max(0.25, lf*(1+0.002*Math.sin(S.t*0.5)));   // 水冷壁工质流量(相对额定)
  const steamPct  = Math.max(0.20, lf);                                  // 过热蒸汽流量(相对额定)
  const flowDef   = Math.max(0, 0.5 - wwFlowPct)*42;                     // 低流量→换热恶化,壁温/温差附加升高
  S._wwFlowPct=wwFlowPct; S._steamPct=steamPct;
  const wallTwork = 435 - (1-lf)*18 + flowDef*0.55;            // 工质温度 ℃(受工质流量影响)
  const baseWallDT = 14 + (1-lf)*4;                            // 稳态内外壁温差
  const wallDT = baseWallDT + lowLoadDT + shock*48 + rate + flowDef*0.4 + 2.6*Math.sin(S.t*0.85) + 1.2*Math.sin(S.t*0.33);   // 内外壁温差 ℃(含波动)
  const sTh = thermalStress(wallDT);            // 热应力 MPa(膜+弯的二次应力)
  let maxStress=0, maxPctY=0, maxId='';
  WW_SENSORS.forEach(s=>{
    const o=S.ww[s.id];
    o.temp = wallTwork + 30 + (s.type==='weld'?6:0) - (s.hdr-3.5)*1.1 + shock*10 + 0.8*Math.sin(S.t*0.5+o.ph); // 金属温度 ℃
    // 机械应力(自重+约束+内压分离)随负荷温和变化
    const mech = (28 + 26*lf)*jit(0.03);
    // 热应力按几何应力集中 kt 放大(管座焊趾), H4(裂纹高发)再叠加裂纹萌生项
    const crackBoost = (s.hdr===3 && (s.type==='weld')) ? S.crackPct*0.9 : (s.hdr===3&&s.type==='endcap'? S.crackPct*0.3:0);
    let stress = mech + sTh*(s.kt/2.0) + crackBoost;
    stress *= (0.955+0.05*Math.sin(S.t*(0.7+s.kt*0.1)+o.ph) + 0.035*Math.sin(S.t*0.6+o.ph*0.5));  // 含波动,趋势可见起伏
    o.stress = stress;
    o.strain = stress/E_HOT*1e6;                 // 反推总应变 με
    o.pctYield = stress/SY_HOT*100;
    o.pctAllow = stress/SALLOW*100;
    if(stress>maxStress){maxStress=stress;maxPctY=o.pctYield;maxId=s.id;}
    // ② Norton-Bailey 蠕变本构在线积分 + Larson-Miller 断裂寿命 + Robinson 损伤累积
    const tHr=S.alg.serviceHrs;
    const rate=ALG.nbRate(stress,o.temp,tHr);          // με/h
    S.creepRate[s.id]=rate*1000;                        // με/kh (显示)
    S.creep[s.id]   += rate*dt*ACCEL*(1+shock*1.5);
    const tr=ALG.ruptureHrs(stress,o.temp); S.lmpTr[s.id]=tr;
    S.robinsonD[s.id]+= dt*ACCEL/tr;                    // Robinson Σ ti/tr
  });
  S.alg.serviceHrs += dt*ACCEL;
  S.ww._max={stress:maxStress,pctY:maxPctY,id:maxId,dt:wallDT,sTh:sTh,twork:wallTwork};

  // 焊缝裂纹扩展(深调循环疲劳 + 裂纹注入): da/dN ~ 应力幅, H4 管座最敏感
  WW_SENSORS.filter(s=>s.type==='weld'||s.type==='endcap').forEach(s=>{
    const o=S.ww[s.id];
    const growth = (S.deepCycle?0.00006:0.0000015)*Math.pow(o.pctAllow/100,2) + (s.hdr===3?S.crackPct*0.00004:0);
    S.weldCrack[s.id]=Math.min(8, S.weldCrack[s.id]+growth*(1+shock*3));
  });

  // ① 应变场重构: RBF 多二次插值(由 16 测点实测应力外推全壁面) + 留一交叉验证置信度
  buildField();

  // ③ PCA/SPE 多维不协同异常检测(残差 Q 统计)
  const speIds=WW_SENSORS.map(s=>s.id);
  const sp=ALG.speUpdate(speIds); S.alg.spe=sp.spe; S.alg.speWorst=sp.worst; S.alg.speZ=sp.zs;
  // ④ Holt 线性趋势预测(对 H4 管座焊缝应力, 代理 LSTM): 实际超预测带 → 屈服/裂纹扩展
  const h4=S.ww['10HAD14-W'].stress;
  const fc=ALG.holtStep(h4, 12);
  if(fc.breach) S.alg._breachUntil=S.t+2.5;                 // 突增越界后锁存数秒
  S.alg.fc={fc:fc.fc, band:fc.band, slope:fc.slope, actual:h4, innov:fc.innov, breach: S.t < (S.alg._breachUntil||-9)};
  // ④ Weibull + 贝叶斯 RUL(以 H4 蠕变速率与最大 Robinson 损伤更新)
  let rdMax=0,rdId=''; speIds.forEach(id=>{if(S.robinsonD[id]>rdMax){rdMax=S.robinsonD[id];rdId=id;}});
  S.alg.robinsonMax=rdMax; S.alg.robinsonId=rdId;
  S.alg.rul=ALG.rul(rdMax, S.creepRate['10HAD14-W']/1000);

  /* ===== 应用2: 管系位移 + 法兰应力 + 猫爪 ===== */
  // 缸体绝对热膨胀(自死点): 随主蒸汽温度/负荷, 卡涩时膨胀受阻(实测值偏小但内部憋应力)
  const freeExp = 22 + lf*14;                   // 自由膨胀目标 mm
  const seizeFactor = S.seize ? 0.62 : 1;       // 卡涩→实测膨胀被约束
  S.expAbs = freeExp*seizeFactor*jit(0.01) + shock*1.5 + 1.3*Math.sin(S.t*0.8) + 0.6*Math.sin(S.t*0.3);
  S.expDiff = (4.2 + lf*2.1)*jit(0.02) + (S.seize?2.4:0) + shock*0.8 + 0.45*Math.sin(S.t*0.85);   // 胀差(转子-缸体) mm
  // 管系位移(拉丝位移传感器): 随热膨胀, 卡涩处位移受限
  PIPE_NODES.forEach((n,i)=>{
    const p=S.pipe[n.id];
    p.disp = n.base*(0.6+0.4*lf)*(S.seize?0.7:1)*jit(0.01) + shock*1.2 + S.expAbs*0.15 + 0.8*Math.sin(S.t*0.8+i*0.9);
    p.tilt = ((n.base-22)*0.04 + (S.seize?0.6:0.12) + shock*0.3)*jit(0.05) + 0.06*Math.sin(S.t*0.75+i);  // 倾角 °
  });
  // 吊杆载荷: 设计冷态预紧, 热态/卡涩→载荷重分配(卡涩吊杆超载, 邻近卸载)
  HANGERS.forEach((h,i)=>{
    const hh=S.hanger[h.id];
    let load = h.rated*(0.92+0.10*lf)*jit(0.02)*(1+0.05*Math.sin(S.t*0.8+i*0.8));
    if(S.seize){ load *= (i===1? 1.42 : (i===2?0.74:1.05)); }  // #2卡涩超载
    load += shock*2.5;
    hh.load=load;
  });

  // 法兰四象限应变: 颈部轴向 εz(弯矩) + 法兰环环向 εθ(翘曲); 无膨胀节→随温度抬升
  const tBase = 300 + lf*255;                   // 主蒸汽温度 ℃(P92, 至620)
  // 缓慢"呼吸"调制(确定性,周期≈40s)→ 趋势可见起伏,但逐帧变化极小不闪烁
  const breath = 1+0.06*Math.sin(S.t*0.7)+0.03*Math.sin(S.t*0.27);
  const thrust = (1-(HAS_EXPANSION_JOINT?0.55:0))*(0.4+0.6*lf)*breath;  // 管系热推力系数
  // 上下温差(保温不均/疏水) — 驱动不对称
  S.flange.dT = (8 + lf*6 + shock*14 + (S.seize?6:0))*(1+0.05*Math.sin(S.t*0.75));
  for(let q=0;q<4;q++){
    // 轴向应变 εz: 弯矩使 0°(上)与180°(下)反相, 90/270 次之; 卡涩/推力放大
    const dir = [1,0.15,-1,-0.15][q];
    const bend = (24 + 72*thrust + (S.seize?110:0) + shock*40);
    S.flange.neckZ[q] = (210 + 175*lf) + dir*bend + 3*Math.sin(S.t*0.6+q*1.7);   // με
    // 环向应变 εθ: 翘曲使各象限不等, 危险象限(180°下/0°上)随推力+温差扩大
    const warpDir=[1.0,0.35,0.8,0.3][q];
    S.flange.ringT[q] = (160+120*lf) + warpDir*(16+48*thrust+(S.seize?105:0)+shock*30)*breath + 2.5*Math.sin(S.t*0.5+q*2.3);
    S.flange.Tq[q] = tBase + [1,0,-1,0][q]*S.flange.dT*0.5 + Math.sin(S.t*0.4+q*1.1);
  }
  // 法兰诊断指标
  const z=S.flange.neckZ, r=S.flange.ringT;
  S.fIdx.By = z[0]-z[2];  S.fIdx.Bx = z[1]-z[3];
  S.fIdx.B = Math.sqrt(S.fIdx.By*S.fIdx.By + S.fIdx.Bx*S.fIdx.Bx);
  S.fIdx.W = Math.max(...r)-Math.min(...r);
  S.fIdx.A = S.fIdx.W/(S.fIdx.B+1e-6);
  S.fIdx.R = S.fIdx.W/(Math.abs(S.flange.dT)+1e-6);
  S.fIdx.dT = S.flange.dT;
  S.fIdx.worstQ = r.indexOf(Math.max(...r));
  // 猫爪侧推力(管系外载经法兰传至缸体→猫爪滑销): 卡涩/弯矩大→侧推上升→失稳风险
  S.catClawLat = (S.fIdx.B*0.18 + (S.seize?52:0) + shock*15)*jit(0.03);
  // 汽机自由膨胀度: 由"末吊架(汽机近端 HG-04)形变 + 主汽-汽机法兰形变"联合判定
  // = 实测缸体膨胀/自由膨胀目标, 经管系约束(法兰弯矩)与末吊架超载修正
  const lastH=S.hanger['HG-04']; const lastOver=Math.max(0,(lastH.load/45-1))*100;
  S.lastHangerOver=lastOver;
  S.freeExpDeg = Math.max(0, Math.min(100, (S.expAbs/freeExp)*100 - Math.max(0,(S.fIdx.B-160))/5 - lastOver*0.4));

  /* 应力方向合成: 末吊架位移 + 法兰位移(弯矩) + 缸体膨胀受阻 → 缸体合成受力方向 + 故障原因 */
  const expDeficit = Math.max(0, freeExp - S.expAbs);              // 缸体膨胀受阻量 mm
  const lastHangDev = lastH.load/45 - 1;                            // 末吊架载荷偏差(相对额定)
  const lastHangDisp = S.pipe['MS-P3'].disp;                        // 汽机入口(末端)位移 mm
  // 轴向力(沿膨胀轴, 指向死点=阻碍膨胀为正): 膨胀受阻 + 末吊架约束
  const Faxial = expDeficit*9 + Math.max(0,lastHangDev)*70 + (S.seize?40:8);
  // 横向力(垂直膨胀轴): 法兰弯矩横向分量 + 末吊架不均
  const Flat = S.fIdx.Bx*0.10 + lastHangDev*30;
  S.stressVec = {ax:Faxial, lat:Flat, mag:Math.hypot(Faxial,Flat), ang:Math.atan2(Flat,Faxial),
                 expDeficit, lastHangDev, lastHangDisp, lastHangLoad:lastH.load};
  // 故障原因判定(无法自由膨胀)
  let cause;
  if(S.seize) cause={t:'r',name:'支吊架卡涩',why:'末吊架(HG-04)超载且缸体膨胀受阻 → 管系热膨胀无法释放,推汽机缸体,猫爪受侧推'};
  else if(S.fIdx.B>240 && S.fIdx.A<1.2) cause={t:'a',name:'管系外载偏大',why:'法兰弯矩高、支吊架偏差,管系对法兰/缸体施加额外推力'};
  else if(expDeficit>6 && Math.abs(lastHangDev)<0.15) cause={t:'a',name:'导向/死点卡涩',why:'缸体膨胀明显不足而吊架载荷正常,疑似滑销/导向卡涩'};
  else cause={t:'g',name:'自由膨胀正常',why:'末吊架、法兰、膨胀三者协调,缸体沿死点自由膨胀'};
  S.stressCause=cause;

  /* ===== DCS 过程数据 ===== */
  S.proc = {
    load: Math.round(RATED_MW*lf),
    wwFlow: Math.round(1850*S._wwFlowPct),                 // 水冷壁工质流量 t/h
    msFlow: Math.round(2117*lf*jit(0.01)),                 // 过热蒸汽流量 t/h
    msTemp: +(605 - (1-lf)*22).toFixed(1)*jit(0.001),       // 过热蒸汽温度 ℃
    msPress:+((8.5 + 20.9*lf)*jit(0.004)).toFixed(2),       // 主蒸汽压力 MPa(滑压)
    fwTemp: +(309 - (1-lf)*34).toFixed(1),                  // 给水温度 ℃
    rhTemp: +(623 - (1-lf)*16).toFixed(1),                  // 再热蒸汽温度 ℃
    wallT:  +(wallTwork+30).toFixed(1),                     // 水冷壁金属温度 ℃
    wallDT: +wallDT.toFixed(1),                             // 内外壁温差 ℃
    furnaceP: +(-0.05 - (1-lf)*0.02).toFixed(3),            // 炉膛负压 kPa
  };

  // 疲劳/蠕变寿命累计
  S.fatigue += dt*(0.0000012 + (S.deepCycle?0.000055:0)*Math.pow(S.ww._max.pctY/100,2) + shock*0.00009);
  S.creepLife += dt*(0.0000008 + Math.pow(Math.max(0,S.ww._max.pctY)/100,3)*0.00004);

  // 历史趋势(滑窗)
  if(!updateSim._ht)updateSim._ht=0; updateSim._ht+=dt;
  if(updateSim._ht>0.5){ updateSim._ht=0;
    const avgCreep = Object.values(S.creep).reduce((a,b)=>a+b,0)/Object.keys(S.creep).length;
    // 累计量趋势叠加随工况的可见波动(卡片仍用真实累计值,趋势线更直观)
    pushHist('creep',avgCreep + 1.6*Math.sin(S.t*0.5)); pushHist('fatigue',S.fatigue*100 + 1.1*Math.sin(S.t*0.6)+0.6*Math.sin(S.t*0.23)); pushHist('maxStress',S.ww._max.stress);
    pushHist('flangeB',S.fIdx.B); pushHist('flangeW',S.fIdx.W); pushHist('expAbs',S.expAbs); pushHist('wallDT',wallDT);
    pushHist('spe',S.alg.spe); pushHist('fcA',S.alg.fc.actual); pushHist('fcP',S.alg.fc.fc); pushHist('catClaw',S.catClawLat);
  }

  evalAlarms(shock);
  S._shock=shock;
}
function pushHist(k,v){ const a=S.hist[k]; a.push(v); if(a.length>120)a.shift(); }

/* 应变场重构: RBF 多二次插值, 由 16 个实测测点外推到 FCOLS×FROWS 连续场
   场量可选: 应力(MPa)/应变(με)/管壁温度(℃); 测点值本身已含 负荷·工质流量·蒸汽流量·壁温 等影响 */
const FCOLS=22, FROWS=15;
let FIELD_TYPE='stress';   // stress | strain | temp
const FIELD_META={stress:{unit:'MPa',k:'stress'}, strain:{unit:'με',k:'strain'}, temp:{unit:'℃',k:'temp'}};
function setFieldType(t){ FIELD_TYPE=t; document.querySelectorAll('#p2_ftbtns .vbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===t)); }
function buildField(){
  const meta=FIELD_META[FIELD_TYPE]||FIELD_META.stress;
  const vals = WW_SENSORS.map(s=>S.ww[s.id][meta.k]);
  ALG.rbfFit(vals);
  if(!buildField._tc) buildField._tc=0; buildField._tc+=1;
  if(buildField._tc%30===0) S.alg.rbfConf=ALG.rbfLOO(WW_SENSORS.map(s=>S.ww[s.id].stress));
  S.fieldUnit=meta.unit;
  const f=[];
  for(let r=0;r<FROWS;r++){ const row=[];
    for(let c=0;c<FCOLS;c++){
      const x=(c+0.5)/FCOLS, y=(r+0.5)/FROWS;
      row.push(ALG.rbfEval(x,y));
    }
    f.push(row);
  }
  S.field=f;
}

/* ---------- 报警评估 ---------- */
function evalAlarms(shock){
  const A=[];
  const m=S.ww._max;
  // 1 水冷壁应力超许用
  if(m.pctY>=1){ // always evaluate
    if(m.stress>SY_HOT*0.9) A.push({lv:'r',src:'水冷壁',msg:`${nameOf(m.id)} 应力 ${m.stress.toFixed(0)}MPa 达屈服 ${m.pctY.toFixed(0)}% — 立即检查`});
    else if(m.stress>SALLOW*1.5) A.push({lv:'a',src:'水冷壁',msg:`${nameOf(m.id)} 应力 ${m.stress.toFixed(0)}MPa 超许用 ${(m.stress/SALLOW*100).toFixed(0)}%`});
  }
  // 2 内外壁温差(热冲击)
  if(m.dt>55) A.push({lv:'r',src:'热应力',msg:`内外壁温差 ${m.dt.toFixed(0)}℃ 过大 — 深调速率/热冲击预警`});
  else if(m.dt>40) A.push({lv:'a',src:'热应力',msg:`内外壁温差 ${m.dt.toFixed(0)}℃ 偏高`});
  // 3 焊缝裂纹
  let maxCrack=0,mcId='';
  Object.keys(S.weldCrack).forEach(k=>{if(S.weldCrack[k]>maxCrack){maxCrack=S.weldCrack[k];mcId=k;}});
  if(maxCrack>3) A.push({lv:'r',src:'焊缝',msg:`${nameOf(mcId)} 裂纹深度 ${maxCrack.toFixed(1)}mm 超限 — 停机检修`});
  else if(maxCrack>1.5) A.push({lv:'a',src:'焊缝',msg:`${nameOf(mcId)} 裂纹深度 ${maxCrack.toFixed(1)}mm 扩展中`});
  // 4 法兰弯矩/翘曲
  if(S.fIdx.B>240) A.push({lv:'a',src:'主汽法兰',msg:`法兰颈弯矩指标 B=${S.fIdx.B.toFixed(0)}με 偏高 — 管系外载/支吊架异常`});
  if(S.fIdx.W>180) A.push({lv:'r',src:'主汽法兰',msg:`法兰翘曲指标 W=${S.fIdx.W.toFixed(0)}με — ${FLANGE_QUAD[S.fIdx.worstQ]} 象限密封风险`});
  // 5 支吊架/猫爪
  if(S.seize){ A.push({lv:'r',src:'管系膨胀',msg:`支吊架卡涩 — 膨胀受阻,猫爪侧推 ${S.catClawLat.toFixed(0)}kN,汽机自由膨胀失效`}); }
  else if(S.catClawLat>40) A.push({lv:'a',src:'猫爪',msg:`猫爪侧推力 ${S.catClawLat.toFixed(0)}kN 升高 — 注意失稳风险`});
  // 6 胀差
  if(S.expDiff>8.5) A.push({lv:'a',src:'胀差',msg:`转子-缸体胀差 ${S.expDiff.toFixed(1)}mm 接近报警`});
  // 7 寿命
  if(S.fatigue>0.85) A.push({lv:'a',src:'寿命',msg:`集箱疲劳累积损伤 ${(S.fatigue*100).toFixed(0)}% — 接近设计限`});
  // 8 算法层: PCA/SPE 多维不协同(早期隐蔽预警) + Holt 预测越界
  if(S.alg && S.alg.spe>60) A.push({lv:'r',src:'算法·SPE',msg:`多维不协同 SPE=${S.alg.spe.toFixed(0)} — ${nameOf(S.alg.speWorst.id)} 脱离健康基线(z=${S.alg.speWorst.z.toFixed(1)}),焊缝早期异常`});
  else if(S.alg && S.alg.spe>25) A.push({lv:'a',src:'算法·SPE',msg:`SPE=${S.alg.spe.toFixed(0)} 偏高 — ${nameOf(S.alg.speWorst.id)} 应变变动率异常`});
  if(S.alg && S.alg.fc.breach) A.push({lv:'a',src:'算法·预测',msg:`H4 实测应力 ${S.alg.fc.actual.toFixed(0)}MPa 突增超 Holt 预测带(+${S.alg.fc.innov.toFixed(0)}) — 疑似局部屈服/微裂纹扩展`});
  if(A.length===0) A.push({lv:'g',src:'系统',msg:'全部测点应力/位移在安全范围,无活动报警'});
  // 记录新出现的报警到日志
  A.filter(a=>a.lv!=='g').forEach(a=>{ const key=a.src+a.msg.slice(0,8); if(!evalAlarms._seen)evalAlarms._seen={}; if(!evalAlarms._seen[key]||S.t-evalAlarms._seen[key]>20){evalAlarms._seen[key]=S.t; pushLog(a.src,a.lv==='r'?'ALARM':'WARN',a.msg);} });
  S.alarms=A;
  // 顶栏全局状态
  const worst = A.some(a=>a.lv==='r')?'r':(A.some(a=>a.lv==='a')?'a':'g');
  const gl=document.getElementById('globalLed'), gt=document.getElementById('globalTxt');
  if(gl){ gl.className='led '+worst; gt.textContent = worst==='r'?'报警':(worst==='a'?'预警':'系统正常'); }
}
function nameOf(id){ const s=WW_SENSORS.find(x=>x.id===id); return s?s.name:id; }

/* ---------- Canvas 工具 ---------- */
function dpiFit(cv){
  const r=cv.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  if(r.width<2) return null;
  cv.width=r.width*dpr; cv.height=(cv.clientHeight||r.height)*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:r.width,h:cv.clientHeight||r.height};
}
function grid(ctx,x,y,w,h,nx,ny){
  ctx.save();
  ctx.fillStyle='#16233c'; ctx.fillRect(x,y,w,h);
  ctx.strokeStyle='#243a5a'; ctx.lineWidth=1;
  for(let i=0;i<=nx;i++){const gx=x+w*i/nx;ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+h);ctx.stroke();}
  for(let i=0;i<=ny;i++){const gy=y+h*i/ny;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+w,gy);ctx.stroke();}
  ctx.strokeStyle='#2a4060';ctx.strokeRect(x,y,w,h);
  ctx.restore();
}
function txt(ctx,s,x,y,col,size,align){ctx.fillStyle=col||'#7aa0c8';ctx.font=(size||10)+'px Consolas,monospace';ctx.textAlign=align||'left';ctx.fillText(s,x,y);}
// 热力色标 (低应力蓝→绿→黄→红)
function heat(v){
  v=Math.min(1,Math.max(0,v));
  const stops=[[26,52,86],[30,110,170],[40,180,150],[120,200,70],[240,200,60],[255,140,40],[230,50,40]];
  const p=v*(stops.length-1);const i=Math.floor(p);const f=p-i;
  const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];
  return `rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;
}
function stressColor(pctAllow){ return pctAllow>140?'#ff5555':(pctAllow>90?'#f5a623':(pctAllow>60?'#70b8ff':'#2ecc71')); }

/* 通用趋势线 */
function drawTrend(cv,series,opts={}){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:opts.l||44,r:opts.r||10,t:10,b:18};
  const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  let mn=opts.min, mx=opts.max;
  if(mn===undefined){mn=Infinity;mx=-Infinity;series.forEach(s=>s.data.forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v);}));}
  const pd=(mx-mn)*0.12||1; if(opts.min===undefined)mn-=pd; if(opts.max===undefined)mx+=pd;
  if(opts.bands)opts.bands.forEach(b=>{
    const y1=gy+gh-(Math.min(b.hi,mx)-mn)/(mx-mn)*gh, y2=gy+gh-(Math.max(b.lo,mn)-mn)/(mx-mn)*gh;
    ctx.fillStyle=b.color||'rgba(245,166,35,.1)';ctx.fillRect(gx,Math.max(gy,y1),gw,Math.min(gh,y2-y1));
  });
  series.forEach(s=>{
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.w||1.5;
    s.data.forEach((v,i)=>{const px=gx+gw*i/(s.data.length-1);const py=gy+gh-(v-mn)/(mx-mn)*gh;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
    ctx.stroke();
    if(s.fill){ctx.lineTo(gx+gw,gy+gh);ctx.lineTo(gx,gy+gh);ctx.closePath();ctx.fillStyle=s.fill;ctx.fill();}
  });
  for(let i=0;i<=4;i++){const val=mx-(mx-mn)*i/4;txt(ctx,val.toFixed(opts.dec!=null?opts.dec:0),gx-4,gy+gh*i/4+3,'#6896be',9,'right');}
  if(opts.title)txt(ctx,opts.title,gx+6,gy+12,'#7aa0c8',10);
  // 图例右对齐,避免与标题文字叠堆
  if(opts.legend){ ctx.font='9px Consolas,monospace';
    let tw=0; opts.legend.forEach(L=>{tw+=14+ctx.measureText(L.name).width+14;});
    let lx=gx+gw-tw;
    opts.legend.forEach(L=>{txt(ctx,'■',lx,gy+11,L.color,11);txt(ctx,L.name,lx+13,gy+11,'#9fc0e0',9);lx+=14+ctx.measureText(L.name).width+14;});}
}

/* =====================================================================
   渲染层
   ===================================================================== */
function mc(label,val,unit,state,trend){
  return `<div class="metric ${state||''}"><div class="accent"></div><div class="ml">${label}</div><div class="mv">${val}${unit?`<small>${unit}</small>`:''}</div>${trend?`<div class="mtrend">${trend}</div>`:''}</div>`;
}
function setHTML(id,h){const e=document.getElementById(id);if(e)e.innerHTML=h;}
// 文本节流: 画布每帧绘制,数字文本最多每 ~430ms 刷新一次,消除数字闪烁
let _txtT={};
function txtOK(ms){ const k=activePage,n=performance.now(); if(_txtT[k]&&n-_txtT[k]<(ms||430))return false; _txtT[k]=n; return true; }

function renderActive(){
  const p=activePage;
  if(p==='p1') renderP1();
  else if(p==='p2') renderP2();
  else if(p==='p3') renderP3();
  else if(p==='p4') renderP4();
  else if(p==='p5') renderP5();
  else if(p==='p6') renderP6();
  else if(p==='p7') renderP7();
  else if(p==='p8') renderP8();
  else if(p==='p9') renderP9();
  else if(p==='p10') renderP10();
  else if(p==='p11') renderP11();
  else if(p==='p12') renderP12();
  else if(p==='p15') renderP15();
  else if(p==='p13') renderP13();
  else if(p==='p14') renderP14();
}

/* ---------- P1 ---------- */
function renderP1(){
  drawOverview(document.getElementById('c_overview'));   // 动画:每帧绘制
  // 显示量 EWMA 平滑(每帧更新),数字文本节流到 ~450ms 刷新,消除闪烁
  const D=renderP1._s||(renderP1._s={}); const sm=(k,v)=>{D[k]=D[k]==null?v:D[k]+0.10*(v-D[k]);return D[k];};
  const m=S.ww._max;
  const msS=sm('ms',m.stress), dtv=sm('dt',m.dt), fbv=sm('fb',S.fIdx.B), eav=sm('ea',S.expAbs),
        exd=sm('exd',S.expDiff), h2=sm('h2',S.hanger['HG-02'].load),
        s14=sm('s14',S.ww['10HAD14-W'].strain), s15=sm('s15',S.ww['10HAD15-W'].strain), s14e=sm('s14e',S.ww['10HAD14-E'].strain);
  const mc1=Math.max(...Object.values(S.weldCrack));
  const now=performance.now();
  if(renderP1._t && now-renderP1._t<450) return;   // 节流文本刷新
  renderP1._t=now;
  const pctY=msS/SY_HOT*100, pctA14=s14/1e6*E_HOT/SALLOW*100;
  setHTML('p1cards',
    mc('机组负荷',S.proc.load,'MW','', S.deepCycle?'深调循环中':'稳定运行')+
    mc('水冷壁最大应力',msS.toFixed(0),'MPa', pctY>85?'alm':(msS>SALLOW*1.5?'warn':''), nameOf(m.id))+
    mc('内外壁温差',dtv.toFixed(0),'℃', dtv>55?'alm':(dtv>40?'warn':''),'热应力驱动')+
    mc('最大焊缝裂纹',mc1.toFixed(1),'mm', mc1>3?'alm':(mc1>1.5?'warn':''),'前墙上集箱管座')+
    mc('法兰弯矩 B',fbv.toFixed(0),'με', fbv>240?'warn':'','主汽-汽机')+
    mc('汽机绝对膨胀',eav.toFixed(1),'mm', S.seize?'alm':'', S.seize?'膨胀受阻':'自由膨胀')
  );
  setHTML('p1_alarms', S.alarms.map(a=>`<div class="alm-row ${a.lv}"><span>${a.lv==='r'?'⛔':(a.lv==='a'?'⚠':'✓')}</span><span>${a.msg}</span><span class="src">${a.src}</span></div>`).join(''));
  document.getElementById('p1_almcount').textContent=S.alarms.filter(a=>a.lv!=='g').length;
  const P=S.proc;
  setHTML('p1_proc',[
    ['机组负荷',P.load+' MW'],['水冷壁工质流量',P.wwFlow+' t/h'],['过热蒸汽流量',P.msFlow+' t/h'],
    ['主蒸汽压力',P.msPress+' MPa'],['给水温度',P.fwTemp+' ℃'],['再热蒸汽温度',P.rhTemp+' ℃'],
    ['水冷壁金属温度',P.wallT+' ℃'],['内外壁温差',P.wallDT+' ℃'],['炉膛负压',P.furnaceP+' kPa'],
  ].map(r=>`<div class="kv"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join(''));
  const rows=[];
  [['10HAD14-W',s14],['10HAD15-W',s15],['10HAD14-E',s14e]].forEach(([id,sv])=>{const pa=sv/1e6*E_HOT/SALLOW*100;rows.push([nameOf(id),id,sv.toFixed(0)+' με',pa.toFixed(0)+'%',badge(pa,90,140)]);});
  rows.push(['主汽法兰弯矩','MS-FLANGE',fbv.toFixed(0)+' με',(fbv/240*100).toFixed(0)+'%',badge(fbv,240,320)]);
  rows.push(['吊杆#2载荷','HG-02',h2.toFixed(0)+' kN',(h2/58*100).toFixed(0)+'%',badge(h2,82,110)]);
  rows.push(['汽机胀差','EXP-DIFF',exd.toFixed(1)+' mm','≤8.5mm',badge(exd,7,8.5)]);
  setHTML('p1_tbl',rows.map(r=>`<tr><td>${r[0]}</td><td class="mono" style="font-size:10px;color:var(--muted)">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join(''));

  const cnt={g:0,a:0,r:0}; welds.forEach(s=>{const c=S.weldCrack[s.id];cnt[c>3?'r':(c>1.5?'a':'g')]++;});
  setHTML('p6cards',

  );
  setHTML('p6_tbl',welds.map(s=>{const o=S.ww[s.id];const c=S.weldCrack[s.id];
    const rate=(S.deepCycle?0.06:0.002)*Math.pow(o.pctAllow/100,2)*(s.hdr===3?3:1);
    const toThrough=Math.max(0.1,((s.type==='weld'?8:50)-c)/Math.max(0.001,rate)/1000);
    const st=c>3?'r':(c>1.5?'a':'g');
    return `<tr><td>${s.name}</td><td>${s.type==='weld'?'管座角焊缝':'端盖环焊缝'}</td><td>${s.kt.toFixed(1)}</td><td>${(o.stress*s.kt/2).toFixed(0)}</td><td style="color:${st==='r'?'#ff5555':(st==='a'?'#f5a623':'#cbd9e8')}">${c.toFixed(2)}</td><td>${rate.toFixed(3)} mm/kh</td><td>${c>1.5?toThrough.toFixed(0)+' kh':'—'}</td><td><span class="pill ${st}">${st==='r'?'停机检修':(st==='a'?'加密检测':'监视')}</span></td></tr>`;}).join(''));
}

    ctx.fillStyle='rgba(255,150,55,'+fl+')';
    ctx.beginPath();ctx.moveTo(bx+8,fy-4);ctx.lineTo(bx+8+20,fy);ctx.lineTo(bx+8,fy+4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(bx+bw-8,fy-4);ctx.lineTo(bx+bw-8-20,fy);ctx.lineTo(bx+bw-8,fy+4);ctx.closePath();ctx.fill(); }

  ctx.beginPath();ctx.moveTo(bx+bw,py);ctx.lineTo(cornerX,py);ctx.lineTo(cornerX,fy);ctx.lineTo(cyx-7,fy);ctx.stroke();

  const beamY=by+8;
  ctx.strokeStyle='#46618a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx+bw,beamY);ctx.lineTo(cornerX,beamY);ctx.stroke();

function roundRectP(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* 应变场云图: 双线性插值热力图 + 测点叠加 */
function drawField(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:54,r:80,t:18,b:24};
  const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  const fld=S.field; if(!fld.length){return;}
  let mn=1e9,mx=-1e9; fld.forEach(r=>r.forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v);}));
  const cw=gw/(FCOLS-1), ch=gh/(FROWS-1);
  // 像素插值
  const res=3;
  for(let py=0;py<gh;py+=res){ for(let px=0;px<gw;px+=res){
    const fx=px/gw*(FCOLS-1), fy=py/gh*(FROWS-1);
    const x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(FCOLS-1,x0+1),y1=Math.min(FROWS-1,y0+1);
    const tx=fx-x0,ty=fy-y0;
    const v=fld[y0][x0]*(1-tx)*(1-ty)+fld[y0][x1]*tx*(1-ty)+fld[y1][x0]*(1-tx)*ty+fld[y1][x1]*tx*ty;
    ctx.fillStyle=heat((v-mn)/(mx-mn+1e-6));ctx.fillRect(gx+px,gy+py,res+1,res+1);
  }}
  ctx.strokeStyle='#2a4060';ctx.strokeRect(gx,gy,gw,gh);
  // 8 集箱分隔
  for(let i=1;i<8;i++){const xx=gx+gw*i/8;ctx.strokeStyle='rgba(20,35,60,.5)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(xx,gy);ctx.lineTo(xx,gy+gh);ctx.stroke();ctx.setLineDash([]);}
  for(let i=0;i<8;i++)txt(ctx,'H'+(i+1),gx+gw*(i+0.5)/8,gy+gh+14,'#7aa0c8',9,'center');
  txt(ctx,'↑ 上集箱',gx-50,gy+12,'#6896be',9);txt(ctx,'管座焊缝带',gx-50,gy+gh*0.55,'#f5a623',9);txt(ctx,'↓ 光管段',gx-50,gy+gh-4,'#6896be',9);
  // 测点叠加
  WW_SENSORS.forEach(s=>{const o=S.ww[s.id];const col=s.hdr;const cx=gx+gw*(col+0.5)/8;
    const cyy=s.type==='weld'?gy+gh*0.5:(s.type==='endcap'?gy+gh*0.35:(s.type==='outlet'?gy+gh*0.18:(s.type==='fin'?gy+gh*0.62:gy+gh*0.8)));
    ctx.fillStyle='#0e1d33';ctx.beginPath();ctx.arc(cx,cyy,3.5,0,6.3);ctx.fill();
    ctx.strokeStyle=stressColor(o.pctAllow);ctx.lineWidth=2;ctx.stroke();});
  // 色标
  const lx=gx+gw+16,lw=14,lh=gh;
  for(let i=0;i<lh;i++){ctx.fillStyle=heat(1-i/lh);ctx.fillRect(lx,gy+i,lw,1);}
  ctx.strokeStyle='#2a4060';ctx.strokeRect(lx,gy,lw,lh);
  txt(ctx,mx.toFixed(0),lx+lw+3,gy+8,'#9fc0e0',9);txt(ctx,((mn+mx)/2).toFixed(0),lx+lw+3,gy+lh/2,'#9fc0e0',9);txt(ctx,mn.toFixed(0),lx+lw+3,gy+lh,'#9fc0e0',9);
  txt(ctx,S.fieldUnit||'MPa',lx+lw+3,gy-4,'#6896be',8);
}

/* 实时应变波形(50Hz 动态): 几个管座焊缝测点 */

/* 总应力=热+机械 堆叠 */

/* 负荷-应力特性曲线 */
function drawLoadStress(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:44,r:10,t:14,b:24};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  // U形: 低负荷热偏差大→应力高; 中负荷低; 高负荷略升
  const f=(lp)=>{const lf=lp/100;const low=lf<0.45?Math.pow((0.45-lf)/0.45,1.2)*22:0;return 28+26*lf+thermalStress(14+(1-lf)*4+low)*0.9;};
  ['#3a5278','#70b8ff'].forEach((col,k)=>{ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=k?2:1.4;if(k)ctx.setLineDash([]);else ctx.setLineDash([4,3]);
    for(let lp=20;lp<=100;lp++){const v=f(lp)*(k?1:0.92);const px=gx+gw*(lp-20)/80;const py=gy+gh-v/260*gh;lp===20?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();});
  ctx.setLineDash([]);
  // 当前工作点
  const cpx=gx+gw*(S.loadPct-20)/80, cpy=gy+gh-f(S.loadPct)/260*gh;
  ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(cpx,cpy,4,0,6.3);ctx.fill();
  ctx.strokeStyle='#ff5555';ctx.globalAlpha=.4+.4*Math.sin(S.t*4);ctx.lineWidth=2;ctx.beginPath();ctx.arc(cpx,cpy,7,0,6.3);ctx.stroke();ctx.globalAlpha=1;
  for(let lp=20;lp<=100;lp+=20)txt(ctx,lp+'%',gx+gw*(lp-20)/80,gy+gh+14,'#6896be',9,'center');
  txt(ctx,'应力MPa',gx-4,gy+10,'#7aa0c8',9,'right');
  txt(ctx,'■ 实测',gx+6,gy+11,'#70b8ff',9);txt(ctx,'┈ FE',gx+58,gy+11,'#3a5278',9);txt(ctx,'● 当前 '+S.loadPct+'%',gx+100,gy+11,'#ff5555',9);
  txt(ctx,'深调低负荷区应力上翘',gx+gw-2,gy+gh-6,'#f5a623',8.5,'right');
}

/* Larson-Miller */
function drawLMP(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:44,r:10,t:14,b:24};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  // LMP 主曲线: 应力 vs P=T(20+lg t)/1000, 12Cr1MoVG 蠕变断裂曲线(示意)
  ctx.beginPath();ctx.strokeStyle='#70b8ff';ctx.lineWidth=2;
  for(let i=0;i<=gw;i++){const P=18+i/gw*5; const stress=Math.max(20,420-(P-18)*72);const px=gx+i;const py=gy+gh-(stress)/420*gh;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.stroke();
  // 当前工作点(由最热测点温度/应力计算 P)
  let hot=0,hotId='';Object.keys(S.creep).forEach(k=>{if(S.creep[k]>hot){hot=S.creep[k];hotId=k;}});
  const o=S.ww[hotId]||S.ww['10HAD14-W'];const Tk=(o.temp+273);const tHrs=412*24;const P=Tk*(20+Math.log10(tHrs))/1000;
  const px=gx+Math.min(gw,Math.max(0,(P-18)/5*gw)), py=gy+gh-o.stress/420*gh;
  ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(px,py,4,0,6.3);ctx.fill();
  txt(ctx,'当前 P='+P.toFixed(1),px+6,py-4,'#ff9b9b',9);
  for(let i=0;i<=4;i++){txt(ctx,(18+i*5/4).toFixed(1),gx+gw*i/4,gy+gh+14,'#6896be',9,'center');}
  txt(ctx,'应力MPa',gx-4,gy+10,'#7aa0c8',9,'right');txt(ctx,'LMP=T(20+lg t)/1000',gx+gw-2,gy+11,'#9fc0e0',9,'right');
  txt(ctx,'蠕变断裂曲线(12Cr1MoVG)',gx+6,gy+gh-6,'#70b8ff',8.5);
}

/* 猫爪膨胀示意(铺满画布: 左=主蒸汽管系→法兰侧推, 中右=宽缸体+猫爪, 右端=死点) */
function drawCatClaw(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  ctx.clearRect(0,0,w,h);
  const exp=S.expAbs, pad=20;
  const baseY=h-38, baseH=14;
  // 基础/台板(通宽)
  ctx.fillStyle='#16233c';ctx.fillRect(pad,baseY,w-2*pad,baseH);
  ctx.strokeStyle='#3a5278';ctx.lineWidth=1.2;ctx.strokeRect(pad,baseY,w-2*pad,baseH);
  ctx.strokeStyle='#243a5a';ctx.lineWidth=1;for(let x=pad+4;x<w-pad-2;x+=14){ctx.beginPath();ctx.moveTo(x,baseY+baseH);ctx.lineTo(x+10,baseY);ctx.stroke();}
  txt(ctx,'基础/台板',pad+4,baseY+baseH-4,'#6896be',8);
  // 几何: 缸体从左侧 1/3 起,宽,铺满至右端死点
  const legH=28, cylH=58, cylBottom=baseY-legH, cylTop=cylBottom-cylH, axisY=cylTop+cylH/2;
  const deadX=w-pad-16, cylRight=deadX-12, cylX=Math.round(w*0.30), cylW=cylRight-cylX;
  const pipeX=pad+36, elbowY=axisY;
  // 主蒸汽管系(左侧下行→水平→法兰, 填充左侧)
  ctx.strokeStyle=S.seize?'#ff5555':'#70b8ff';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pipeX,24);ctx.lineTo(pipeX,elbowY);ctx.lineTo(cylX-7,elbowY);ctx.stroke();ctx.lineCap='butt';
  txt(ctx,'主蒸汽管系',pipeX-6,18,'#9fc0e0',9.5);
  // 法兰
  const ffc=S.fIdx.W>180?'#ff5555':(S.fIdx.B>240?'#f5a623':'#70b8ff');
  ctx.fillStyle=ffc;ctx.fillRect(cylX-7,elbowY-12,7,24);txt(ctx,'法兰',cylX-10,elbowY-16,ffc,8.5,'right');
  // 转子中心线(贯穿)
  ctx.strokeStyle='#8aa8cf';ctx.setLineDash([7,5]);ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(cylX+8,axisY);ctx.lineTo(cylRight+18,axisY);ctx.stroke();ctx.setLineDash([]);
  // 猫爪 ×3
  [0.2,0.5,0.8].forEach(fr=>{const xx=cylX+cylW*fr;
    ctx.fillStyle='#2a4060';ctx.fillRect(xx-24,baseY-5,48,5);
    ctx.fillStyle=S.seize?'#e8604f':'#6f93bd';ctx.strokeStyle='#46618a';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(xx-14,cylBottom);ctx.lineTo(xx+14,cylBottom);ctx.lineTo(xx+19,baseY-5);ctx.lineTo(xx-19,baseY-5);ctx.closePath();ctx.fill();ctx.stroke();
    const aL=18*Math.min(1,exp/28);ctx.strokeStyle=S.seize?'#ff8a7a':'#2ecc71';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(xx+aL/2,baseY-1);ctx.lineTo(xx-aL/2,baseY-1);ctx.lineTo(xx-aL/2+6,baseY-4);ctx.moveTo(xx-aL/2,baseY-1);ctx.lineTo(xx-aL/2+6,baseY+2);ctx.stroke();});
  // 缸体(金属渐变, 宽)
  const g=ctx.createLinearGradient(0,cylTop,0,cylBottom);
  g.addColorStop(0,'#42608a');g.addColorStop(.5,'#5d7aa4');g.addColorStop(1,'#2b405e');
  ctx.fillStyle=g;ctx.strokeStyle=S.seize?'#ff5555':'#7693bc';ctx.lineWidth=1.8;
  roundRectP(ctx,cylX,cylTop,cylW,cylH,9);ctx.fill();ctx.stroke();
  txt(ctx,'汽轮机高压缸',cylX+cylW/2,axisY+5,'#eaf2ff',12,'center');
  // 死点(固定锚)
  ctx.fillStyle='#2ecc71';ctx.fillRect(deadX,cylTop+6,8,baseY-cylTop-6);
  ctx.strokeStyle='#2ecc71';ctx.lineWidth=1;for(let yy=cylTop+12;yy<baseY;yy+=10){ctx.beginPath();ctx.moveTo(deadX+8,yy);ctx.lineTo(deadX+15,yy-6);ctx.stroke();}
  txt(ctx,'死点',deadX+4,cylTop-7,'#2ecc71',9,'center');
  // 膨胀尺寸(自死点向左; 标注抬高,避免与"死点"叠字)
  const exC=S.seize?'#ff5555':'#2ecc71';ctx.strokeStyle=exC;ctx.lineWidth=2;

  ctx.beginPath();ctx.moveTo(e0,cylTop-19);ctx.lineTo(e0,cylTop-10);ctx.moveTo(e0,cylTop-14);ctx.lineTo(e1,cylTop-14);ctx.lineTo(e1+6,cylTop-17);ctx.moveTo(e1,cylTop-14);ctx.lineTo(e1+6,cylTop-11);ctx.stroke();
  txt(ctx,'缸体膨胀 '+exp.toFixed(1)+'mm'+(S.seize?' (受阻!)':''),e1,cylTop-19,exC,9,'left');
  // 管系侧推力(沿水平管→法兰, 粗细随力)
  const fcol=S.catClawLat>60?'#ff5555':(S.catClawLat>40?'#f5a623':'#7aa0c8');
  const sa0=pipeX+18, sa1=cylX-12;
  ctx.strokeStyle=fcol;ctx.lineWidth=Math.min(11,3+S.catClawLat/11);
  ctx.beginPath();ctx.moveTo(sa0,elbowY);ctx.lineTo(sa1,elbowY);ctx.stroke();
  ctx.fillStyle=fcol;ctx.beginPath();ctx.moveTo(sa1+5,elbowY);ctx.lineTo(sa1-9,elbowY-8);ctx.lineTo(sa1-9,elbowY+8);ctx.closePath();ctx.fill();
  txt(ctx,'管系侧推 '+S.catClawLat.toFixed(0)+'kN',(sa0+sa1)/2,elbowY-9,fcol,9.5,'center');
  // 底部标签
  txt(ctx,'猫爪滑销 ×3 (沿台板滑动,吸收缸体膨胀)',pad,h-7,S.seize?'#ff5555':'#8fb0d8',9);
  txt(ctx,'胀差(转子-缸体) '+S.expDiff.toFixed(1)+'mm',w-pad,h-7,'#9fc0e0',9,'right');
  if(S.seize){ctx.fillStyle='rgba(255,85,85,'+(0.5+0.3*Math.sin(S.t*5))+')';ctx.font='bold 13px Segoe UI';ctx.textAlign='center';ctx.fillText('⚠ 自由膨胀受阻 · 猫爪失稳风险',w/2,14);}
}

/* 应力方向合成: 末吊架 + 法兰横向 + 膨胀阻力 → 合成应力方向矢量 */
function drawStressDir(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  ctx.clearRect(0,0,w,h);
  const sv=S.stressVec; const cx=w*0.34, cy=h*0.56;
  const sc=Math.min((w-cx)*0.78,(h*0.34))/Math.max(80,sv.mag);
  // 坐标轴
  ctx.strokeStyle='#273a55';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx-50,cy);ctx.lineTo(w-12,cy);ctx.moveTo(cx,22);ctx.lineTo(cx,h-26);ctx.stroke();
  txt(ctx,'轴向(阻碍膨胀→死点)',w-12,cy-5,'#6896be',8.5,'right');txt(ctx,'横向',cx+5,h-28,'#6896be',8.5);
  // 缸体小图标(原点)
  ctx.fillStyle='#3a5278';ctx.strokeStyle='#5d7aa4';ctx.lineWidth=1;roundRectP(ctx,cx-17,cy-10,34,20,4);ctx.fill();ctx.stroke();
  txt(ctx,'缸体',cx,cy+4,'#9fc0e0',8,'center');
  // 箭头工具(无尖端文字,靠图例说明,避免叠堆)
  const arr=(vx,vy,col,lw)=>{ if(Math.hypot(vx,vy)<0.6)return; const ex=cx+vx*sc, ey=cy+vy*sc, a=Math.atan2(ey-cy,ex-cx);
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-11*Math.cos(a-0.42),ey-11*Math.sin(a-0.42));ctx.lineTo(ex-11*Math.cos(a+0.42),ey-11*Math.sin(a+0.42));ctx.closePath();ctx.fill(); };
  // 三个分量(细)
  arr(sv.expDeficit*9+(S.seize?40:8),0,'#2ecc71',2.2);
  arr(Math.max(0,sv.lastHangDev)*70, sv.lastHangDev*9,'#70b8ff',2.2);
  arr(0, S.fIdx.Bx*0.10,'#f5a623',2.2);
  // 合成矢量(粗)
  const rc=S.stressCause.t==='r'?'#ff5555':(S.stressCause.t==='a'?'#f5a623':'#2ecc71');
  arr(sv.ax, sv.lat, rc,4);
  txt(ctx,'合成应力 '+sv.mag.toFixed(0)+'kN @ '+(sv.ang*180/Math.PI).toFixed(0)+'°',w/2,h-8,rc,10.5,'center');
  // 图例(顶部一行)
  let lx=8;[['膨胀阻力','#2ecc71'],['末吊架','#70b8ff'],['法兰横向','#f5a623'],['合成','rc']].forEach(L=>{const c=L[1]==='rc'?rc:L[1];ctx.fillStyle=c;ctx.fillRect(lx,7,9,9);txt(ctx,L[0],lx+11,15,'#9fc0e0',8.5);lx+=13+ctx.measureText(L[0]).width+10;});
}

/* 膨胀-侧推力关联(轨迹+参考线: 膨胀↓→侧推↑) */
function drawExpCorr(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:50,r:14,t:16,b:30};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  const X=S.hist.expAbs, Y=S.hist.catClaw, n=Math.min(X.length,Y.length);
  const xmax=40, ymax=Math.max(150,...Y)*1.08;
  const PX=v=>gx+gw*Math.min(xmax,Math.max(0,v))/xmax, PY=v=>gy+gh-Math.min(ymax,Math.max(0,v))/ymax*gh;
  // 受阻区(膨胀<18mm)阴影
  const xb=PX(18);ctx.fillStyle='rgba(255,85,85,.07)';ctx.fillRect(gx,gy,xb-gx,gh);
  ctx.strokeStyle='rgba(255,85,85,.45)';ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(xb,gy);ctx.lineTo(xb,gy+gh);ctx.stroke();ctx.setLineDash([]);
  txt(ctx,'受阻区',gx+6,gy+gh-6,'#ff8a8a',8.5);
  // 参考关系线(反相关: 膨胀大→侧推小)
  ctx.strokeStyle='rgba(245,166,35,.55)';ctx.lineWidth=1.6;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(PX(8),PY(135));ctx.lineTo(PX(38),PY(22));ctx.stroke();ctx.setLineDash([]);
  txt(ctx,'反相关参考',PX(30),PY(40),'#f5a623',8.5,'center');
  // 轨迹(近 60 点连线, 渐隐 → 直观看到点在动)
  const start=Math.max(0,n-60);
  for(let i=start+1;i<n;i++){ const a=(i-start)/(n-start);
    ctx.strokeStyle='rgba(112,184,255,'+(0.12+0.7*a)+')';ctx.lineWidth=0.6+1.8*a;
    ctx.beginPath();ctx.moveTo(PX(X[i-1]),PY(Y[i-1]));ctx.lineTo(PX(X[i]),PY(Y[i]));ctx.stroke();}
  // 历史点(小)
  for(let i=start;i<n;i++){const a=(i-start)/(n-start);ctx.fillStyle='rgba(150,200,255,'+(0.15+0.5*a)+')';ctx.beginPath();ctx.arc(PX(X[i]),PY(Y[i]),1.8,0,6.3);ctx.fill();}
  // 当前点(脉动光晕,大)
  const cpx=PX(S.expAbs), cpy=PY(S.catClawLat);
  const gl=ctx.createRadialGradient(cpx,cpy,0,cpx,cpy,12);gl.addColorStop(0,'rgba(255,90,90,.85)');gl.addColorStop(1,'rgba(255,90,90,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cpx,cpy,12,0,6.3);ctx.fill();
  ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(cpx,cpy,4.5,0,6.3);ctx.fill();
  txt(ctx,'当前 '+S.expAbs.toFixed(0)+'mm/'+S.catClawLat.toFixed(0)+'kN',cpx+ (cpx>gx+gw*0.6?-6:8),cpy-8,'#ff9b9b',8.5, cpx>gx+gw*0.6?'right':'left');
  // 轴
  for(let v=0;v<=40;v+=10)txt(ctx,v,PX(v),gy+gh+14,'#6896be',8.5,'center');
  for(let v=0;v<=ymax;v+=50)txt(ctx,v,gx-4,PY(v)+3,'#6896be',8,'right');
  txt(ctx,'侧推力 kN ↑',gx-4,gy+10,'#9fc0e0',9,'right');txt(ctx,'缸体绝对膨胀 mm →',gx+gw,gy+gh+26,'#9fc0e0',9,'right');
}

/* 负荷-应力相关性散点 */
function drawCorr(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:44,r:10,t:14,b:24};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  if(!drawCorr._pts)drawCorr._pts=[];
  drawCorr._pts.push({l:S.loadPct,s:S.ww._max.stress});if(drawCorr._pts.length>160)drawCorr._pts.shift();
  drawCorr._pts.forEach((p,i)=>{const px=gx+gw*(p.l-20)/80;const py=gy+gh-p.s/260*gh;
    ctx.fillStyle='rgba(112,184,255,'+(0.2+0.6*i/drawCorr._pts.length)+')';ctx.beginPath();ctx.arc(px,py,2.5,0,6.3);ctx.fill();});
  // 拟合趋势曲线(负荷-最大应力机理模型, U形): 低负荷热偏差↑ 中负荷低 高负荷略升
  const f=(lp)=>{const lf=lp/100;const low=lf<0.45?Math.pow((0.45-lf)/0.45,1.2)*22:0;return 28+26*lf+thermalStress(14+(1-lf)*4+low)*0.9;};
  ctx.beginPath();ctx.strokeStyle='#f5a623';ctx.lineWidth=2;
  for(let lp=20;lp<=100;lp++){const v=f(lp);const px=gx+gw*(lp-20)/80;const py=gy+gh-v/260*gh;lp===20?ctx.moveTo(px,py):ctx.lineTo(px,py);}
  ctx.stroke();
  // 沿曲线流动的高亮光点(动态展示负荷-应力关系)
  const sp=60+40*Math.sin(S.t*0.5);
  const spx=gx+gw*(sp-20)/80, spy=gy+gh-f(sp)/260*gh;
  const glow=ctx.createRadialGradient(spx,spy,0,spx,spy,11);
  glow.addColorStop(0,'rgba(255,224,138,.9)');glow.addColorStop(1,'rgba(255,224,138,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(spx,spy,11,0,6.3);ctx.fill();
  ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(spx,spy,3,0,6.3);ctx.fill();
  // 当前工作点
  const cpx=gx+gw*(S.loadPct-20)/80,cpy=gy+gh-S.ww._max.stress/260*gh;
  ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(cpx,cpy,4,0,6.3);ctx.fill();
  for(let lp=20;lp<=100;lp+=20)txt(ctx,lp+'%',gx+gw*(lp-20)/80,gy+gh+14,'#6896be',9,'center');
  txt(ctx,'最大应力MPa',gx-4,gy+10,'#7aa0c8',9,'right');txt(ctx,'机组负荷 →',gx+gw,gy+gh+22,'#7aa0c8',9,'right');
  txt(ctx,'● 实测散点  ',gx+6,gy+11,'#70b8ff',8.5);txt(ctx,'— 拟合曲线(低负荷上翘)',gx+66,gy+11,'#f5a623',8.5);
}

/* 算法流水线数据流图 */
function drawPipeline(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  ctx.clearRect(0,0,w,h);
  const a=S.alg;
  // 输入源(左) → 4层 → 预警(右)
  const lanes=[
    {x:0.02,w:0.13,t:'输入',sub:['流量/温度','压力/负荷(DCS)','16路应变(Acheron)'],col:'#2e78e0'},
    {x:0.17,w:0.17,t:'①场映射/重构',sub:['RBF 插值','PINN 代理','置信 '+a.rbfConf.toFixed(0)+'%'],col:'#70b8ff'},
    {x:0.36,w:0.17,t:'②蠕变本构',sub:['Norton-Bailey','Larson-Miller','Robinson D='+a.robinsonMax.toFixed(2)],col:'#2ecc71'},
    {x:0.55,w:0.17,t:'③异常检测',sub:['PCA / SPE','SPE='+a.spe.toFixed(0),a.spe>25?'⚠不协同':'协同正常'],col:a.spe>25?'#f5a623':'#a78bfa'},
    {x:0.74,w:0.17,t:'④预测/寿命',sub:['Holt(代理LSTM)','Weibull/Bayes','RUL '+(a.rul.med/8760).toFixed(1)+'年'],col:'#ff9d4d'},
  ];
  const boxY=h*0.16, boxH=h*0.6;
  lanes.forEach((L,i)=>{const bx=L.x*w, bw=L.w*w;
    ctx.fillStyle='#16233c';ctx.strokeStyle=L.col;ctx.lineWidth=1.4;roundRectP(ctx,bx,boxY,bw-6,boxH,6);ctx.fill();ctx.stroke();
    txt(ctx,L.t,bx+6,boxY+16,L.col,i?10.5:11,'left');
    L.sub.forEach((s,k)=>txt(ctx,s,bx+6,boxY+34+k*15,'#9fc0e0',9.5));
    // 流动箭头
    if(i<lanes.length-1){const ax=bx+bw-6, ax2=lanes[i+1].x*w;const my=boxY+boxH/2;
      ctx.strokeStyle='#3a5278';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ax,my);ctx.lineTo(ax2,my);ctx.stroke();
      // 流动光点
      const fp=(S.t*0.6+i*0.25)%1; const px=ax+(ax2-ax)*fp;
      ctx.fillStyle=L.col;ctx.beginPath();ctx.arc(px,my,3,0,6.3);ctx.fill();
      ctx.fillStyle='#3a5278';ctx.beginPath();ctx.moveTo(ax2,my);ctx.lineTo(ax2-5,my-3);ctx.lineTo(ax2-5,my+3);ctx.closePath();ctx.fill();}
  });
  txt(ctx,'机理模型(偏微分方程/本构) + 数据驱动(统计/AI) 融合 · 蓝绿橙=精确计算 · 紫=PINN/LSTM 演示替身',w/2,h-6,'#6896be',9,'center');
}

/* SPE 异常趋势 + 控制限 */
function drawAnomaly(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:34,r:8,t:10,b:16};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  const d=S.hist.spe; const mx=Math.max(80, ...d)*1.1;
  // 控制限
  [[25,'#f5a623'],[60,'#ff5555']].forEach(([v,c])=>{const yy=gy+gh-v/mx*gh;ctx.strokeStyle=c;ctx.globalAlpha=.6;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(gx,yy);ctx.lineTo(gx+gw,yy);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;});
  ctx.beginPath();ctx.strokeStyle='#a78bfa';ctx.lineWidth=1.6;
  d.forEach((v,i)=>{const px=gx+gw*i/(d.length-1);const py=gy+gh-Math.min(v,mx)/mx*gh;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.stroke();ctx.lineTo(gx+gw,gy+gh);ctx.lineTo(gx,gy+gh);ctx.closePath();ctx.fillStyle='rgba(167,139,250,.12)';ctx.fill();
  txt(ctx,'SPE',gx-4,gy+9,'#7aa0c8',9,'right');txt(ctx,'控制限 25/60',gx+gw-2,gy+10,'#9fc0e0',8.5,'right');
}

/* Holt 预测: 实测 vs 预测 + 预测带 */
function drawForecast(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:38,r:8,t:10,b:16};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  const A=S.hist.fcA, P=S.hist.fcP; let mn=1e9,mx=-1e9;
  A.concat(P).forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v);}); const pd=(mx-mn)*0.2||10;mn-=pd;mx+=pd;
  const Y=v=>gy+gh-(v-mn)/(mx-mn)*gh;
  // 预测带
  const band=S.alg.fc.band;
  ctx.beginPath();P.forEach((v,i)=>{const px=gx+gw*i/(P.length-1);i?ctx.lineTo(px,Y(v+band)):ctx.moveTo(px,Y(v+band));});
  for(let i=P.length-1;i>=0;i--){const px=gx+gw*i/(P.length-1);ctx.lineTo(px,Y(P[i]-band));}
  ctx.closePath();ctx.fillStyle='rgba(255,157,77,.12)';ctx.fill();
  // 预测线
  ctx.beginPath();ctx.strokeStyle='#ff9d4d';ctx.lineWidth=1.3;ctx.setLineDash([4,3]);
  P.forEach((v,i)=>{const px=gx+gw*i/(P.length-1);i?ctx.lineTo(px,Y(v)):ctx.moveTo(px,Y(v));});ctx.stroke();ctx.setLineDash([]);
  // 实测线
  ctx.beginPath();ctx.strokeStyle='#70b8ff';ctx.lineWidth=1.7;
  A.forEach((v,i)=>{const px=gx+gw*i/(A.length-1);i?ctx.lineTo(px,Y(v)):ctx.moveTo(px,Y(v));});ctx.stroke();
  txt(ctx,'■实测',gx+4,gy+9,'#70b8ff',9);txt(ctx,'┈预测带',gx+50,gy+9,'#ff9d4d',9);txt(ctx,'MPa',gx-4,gy+9,'#7aa0c8',8,'right');
}

/* Weibull RUL 概率密度 */
function drawRUL(cv){
  const F=dpiFit(cv); if(!F)return; const {ctx,w,h}=F;
  const pad={l:30,r:8,t:10,b:18};const gx=pad.l,gy=pad.t,gw=w-pad.l-pad.r,gh=h-pad.t-pad.b;
  grid(ctx,gx,gy,gw,gh,8,4);
  const R=S.alg.rul; const k=R.k, lam=R.lam*(1-Math.min(0.98,S.alg.robinsonMax));
  const xmaxYr=Math.max(8, R.hi/8760*1.3);
  // Weibull pdf
  let pk=0;const pts=[];
  for(let i=0;i<=gw;i++){const tYr=i/gw*xmaxYr; const t=tYr*8760;
    const pdf=(k/lam)*Math.pow(t/lam,k-1)*Math.exp(-Math.pow(t/lam,k)); pts.push(pdf);pk=Math.max(pk,pdf);}
  ctx.beginPath();ctx.strokeStyle='#70b8ff';ctx.lineWidth=1.7;
  pts.forEach((v,i)=>{const px=gx+i;const py=gy+gh-v/pk*gh*0.92;i?ctx.lineTo(px,py):ctx.moveTo(px,py);});
  ctx.stroke();ctx.lineTo(gx+gw,gy+gh);ctx.lineTo(gx,gy+gh);ctx.closePath();ctx.fillStyle='rgba(112,184,255,.12)';ctx.fill();
  // 中位/区间线
  [[R.med,'#2ecc71','中位'],[R.lo,'#f5a623','P10'],[R.hi,'#f5a623','P90']].forEach(([v,c,lb])=>{const xx=gx+gw*Math.min(1,(v/8760)/xmaxYr);ctx.strokeStyle=c;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(xx,gy);ctx.lineTo(xx,gy+gh);ctx.stroke();ctx.setLineDash([]);txt(ctx,lb,xx,gy+9,c,8,'center');});
  for(let i=0;i<=4;i++)txt(ctx,(xmaxYr*i/4).toFixed(0),gx+gw*i/4,gy+gh+13,'#6896be',8,'center');
  txt(ctx,'剩余寿命 / 年',gx+gw,gy+gh+13,'#7aa0c8',8.5,'right');
}

/* =====================================================================
   主循环 + 启动
   ===================================================================== */
function tickClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleDateString('zh-CN')+' '+d.toLocaleTimeString('zh-CN',{hour12:false});}
let _last=performance.now();
function loop(now){
  let dt=(now-_last)/1000;_last=now;if(dt>0.1)dt=0.1;
  updateSim(dt);
  renderActive();
  requestAnimationFrame(loop);
}
function boot(){
  initState();
  buildNav();
  buildPages();
  tickClock();setInterval(tickClock,1000);
  requestAnimationFrame(loop);
}
boot();
</script>
